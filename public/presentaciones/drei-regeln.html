<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drei Regeln, ein Satz · Mein Alltag auf Deutsch</title>
<link rel="stylesheet" href="/design-tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--card:var(--dt-ink-2);--card2:var(--dt-ink-3);--ink:var(--dt-paper);--dim:var(--dt-muted);--line:var(--dt-hair-2);--red:var(--dt-red);--ok:var(--dt-ok);--gold:var(--dt-gold);
  --sans:'Space Grotesk',var(--dt-display),system-ui,sans-serif;--mono:'JetBrains Mono',var(--dt-mono),ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background-color:var(--dt-ink-0);color:var(--ink);font-family:var(--sans);font-size:clamp(15px,.9vw + 9px,22px);line-height:1.4;
  background-image:radial-gradient(var(--dt-hair) 1px,transparent 1px);background-size:26px 26px}
button,input,select,textarea{font:inherit;color:inherit}
b{font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── Marco: barra superior, bloques, progreso ── */
#top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;display:flex;align-items:center;gap:14px;padding:0 var(--dt-pad);background:linear-gradient(var(--dt-ink-0),rgba(7,7,7,.85));border-bottom:1px solid var(--dt-hair)}
#brand{font:700 .7em var(--mono);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
#brand i{color:var(--red);font-style:normal}
#blocks{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
#blocks button{background:transparent;border:1px solid var(--dt-hair);border-radius:999px;padding:.25em .8em;font:600 .72em var(--mono);color:var(--dim);cursor:pointer;white-space:nowrap;min-height:30px}
#blocks button.on{border-color:var(--red);color:var(--ink);background:color-mix(in srgb,var(--red) 14%,transparent)}
#blocks small{display:none;margin-left:.5em;opacity:.8}
body.times #blocks small{display:inline}
#num{font:700 .8em var(--mono);color:var(--dim);white-space:nowrap}
#bar{position:fixed;left:0;bottom:0;height:3px;background:var(--red);z-index:21;transition:width .35s var(--dt-ease)}
#nav{position:fixed;bottom:10px;right:var(--dt-pad);z-index:20;display:flex;gap:8px;align-items:center}
#nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--dt-ink-1);cursor:pointer;font-size:1.1em}
#nav button:hover{border-color:var(--red)}
#hint{position:fixed;bottom:14px;left:var(--dt-pad);z-index:20;font:500 .62em var(--mono);color:var(--dim);letter-spacing:.04em;max-width:60vw}
#notes{position:fixed;left:var(--dt-pad);right:var(--dt-pad);bottom:56px;z-index:22;background:var(--dt-ink-1);border:1px solid var(--red);border-radius:var(--dt-r-md);padding:.8em 1.1em;font-size:.82em;display:none}
#notes.on{display:block}
#notes b{font-family:var(--mono);color:var(--red)}

/* ── Diapositivas ── */
section.slide{position:absolute;inset:0;padding:70px var(--dt-pad) 70px;overflow-y:auto;overflow-x:hidden;opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .3s,transform .3s var(--dt-ease),visibility 0s .3s}
section.slide.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.sl{max-width:1180px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:1.4vh}
.eyebrow{font:700 .7em var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
h2{font-size:clamp(1.7rem,1.1rem + 2.4vw,3.2rem);line-height:1.04;letter-spacing:-.02em;font-weight:700}
h2 em{font-style:normal;color:var(--red)}
.lead{color:var(--dt-paper-2);max-width:62ch}
.lead b{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--dt-r-md);padding:1em 1.2em}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,28px);align-items:start}
@media(max-width:860px){.cols{grid-template-columns:1fr}#hint{display:none}}
@media(max-width:1560px){#brand{display:none}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--red);color:var(--dt-ink-0);border:1px solid var(--red);border-radius:12px;padding:.5em 1.1em;font-weight:700;cursor:pointer;min-height:44px;transition:transform .15s var(--dt-ease),background .15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--red)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a.btn{display:inline-flex;align-items:center;text-decoration:none}

/* ── Tokens de frase (con FLIP) ── */
.stage{display:flex;flex-wrap:wrap;gap:.55em;align-items:flex-end;min-height:4.2em;padding:.4em 0}
.tk{display:inline-flex;align-items:center;position:relative;margin-top:1.5em;padding:.4em .8em;border:1px solid var(--line);border-radius:12px;background:var(--card2);font-weight:600;font-size:1.15em;white-space:nowrap}
.tk[data-b]::before{content:attr(data-b);position:absolute;top:-1.55em;left:2px;font:700 .55em var(--mono);color:var(--dim);letter-spacing:.08em}
.tk.mod{border-color:var(--red);color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.tk.fin{border-color:var(--red);color:var(--red)}
.tk.pre{background:var(--ink);color:var(--dt-ink-0);border-color:var(--ink)}
.tk.pos{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.tk.inf{border-style:dashed;border-color:var(--ink)}
.tk.dim{opacity:.38}
.tk.joined{margin-left:-.55em}
.tk.pre.joined{margin-left:0;border-radius:12px 0 0 12px}
.tk.joined:not(.pre){border-radius:0 12px 12px 0;border-left:0}
.tk.lit{box-shadow:0 0 0 3px var(--dt-red-glow)}
button.tk{cursor:pointer;font-family:inherit}
.caption{min-height:3em;color:var(--dt-paper-2);max-width:70ch}
.caption b{color:var(--ink)}

/* ── Quiz ── */
.quiz{display:flex;flex-direction:column;gap:.7em}
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pips{display:flex;gap:6px}
.pip{width:30px;height:10px;border-radius:5px;border:0;background:var(--dt-hair-2);cursor:pointer;padding:0}
.pip.ok{background:var(--ok)}.pip.no{background:var(--red)}.pip.cur{outline:2px solid var(--ink);outline-offset:2px}
.qcount{font:700 .75em var(--mono);color:var(--dim)}
.qbody{min-height:7.5em;display:flex;flex-direction:column;gap:.8em}
.qt{font-size:1.25em;font-weight:600;line-height:1.5}
.qt.sent{font-size:1.4em}
.qt mark{background:color-mix(in srgb,var(--red) 28%,transparent);color:var(--ink);border-radius:4px;padding:0 .2em}
input.gap{background:var(--dt-ink-0);border:2px solid var(--line);border-radius:10px;padding:.2em .5em;font-weight:700;text-align:center;min-width:5em;max-width:100%}
input.gap.wide{width:min(100%,30em);text-align:left}
input.gap:focus{border-color:var(--ink);outline:none}
input.gap.ok{border-color:var(--ok);color:var(--ok)}input.gap.no{border-color:var(--red);color:var(--red)}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:.5em 1.1em;font-weight:700;cursor:pointer;min-height:44px;font-size:1.05em}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{border-color:var(--ok);color:var(--ok)}.opt.no{border-color:var(--red);color:var(--red)}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--ink);text-align:center;margin:0 .15em}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--red);border-color:var(--red)}
.qfb{min-height:3.2em;font-size:.95em;padding:.1em 0}
.qfb.good{color:var(--ok)}.qfb.bad{color:#ff8e89}
.qfb b{color:inherit}.qfb span{color:var(--dt-paper-2)}
.qnav{display:flex;gap:8px;flex-wrap:wrap}
.line{display:flex;gap:.5em;flex-wrap:wrap;min-height:3.2em;padding:.5em;border:2px dashed var(--line);border-radius:12px;align-items:center}
.pool{display:flex;gap:.5em;flex-wrap:wrap}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:.35em .8em;font-weight:600;cursor:pointer;min-height:40px}
.chip:hover{border-color:var(--ink)}
.chip.ok{border-color:var(--ok);color:var(--ok)}.chip.no{border-color:var(--red);color:var(--red)}
.machine{display:flex;gap:.6em;flex-wrap:wrap;align-items:flex-end}
.slotw{display:flex;flex-direction:column;gap:.3em}
.slotw small{font:700 .55em var(--mono);color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.slotw .box,.slotw select{background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:.4em .8em;font-weight:700;min-height:44px;font-size:1.1em}
.slotw select.ok{border-color:var(--ok)}.slotw select.no{border-color:var(--red)}
.slotw .box.inf{border-style:dashed}

/* ── Piezas de cada diapositiva ── */
.persons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:860px){.persons{grid-template-columns:repeat(2,1fr)}}
.pc{display:flex;flex-direction:column;align-items:center;gap:.15em;padding:.7em .4em;border:1px solid var(--line);border-radius:var(--dt-r-md);background:var(--card);transition:border-color .2s,transform .2s var(--dt-ease)}
.pc .pr{font:600 .8em var(--mono);color:var(--dim)}
.pc .po{font-size:1.7em;line-height:1}
.pc.hl{border-color:var(--red);transform:translateY(-3px);background:color-mix(in srgb,var(--red) 10%,var(--card))}
.pc.hl .po{color:var(--red)}
.ask{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--dt-r-md);padding:.8em 1em;cursor:pointer;width:100%;margin-bottom:8px}
.ask:hover{border-color:var(--ink)}
.av{flex:none;width:2.4em;height:2.4em;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font:700 .8em var(--mono)}
.ask .a{display:none;color:var(--ok);font-weight:600;margin-top:.2em}
.ask.on .a{display:block}
.ask b.k{color:var(--red)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 .4em;font:600 .7em var(--mono);color:var(--dim);margin-left:.4em}
.ar{display:flex;align-items:baseline;gap:.8em;padding:.45em 0;border-bottom:1px solid var(--dt-hair)}
.ar .g{width:5.2em;font:600 .72em var(--mono);color:var(--dim)}
.ar .w{font-size:1.35em;font-weight:600}
.suf{display:inline-block;max-width:0;overflow:hidden;vertical-align:bottom;opacity:0;color:var(--red);transition:max-width .5s var(--dt-ease),opacity .4s}
.akk .suf{max-width:1.4em;opacity:1}
.same{font:600 .5em var(--mono);color:var(--dim);opacity:0;margin-left:.6em;transition:opacity .4s}
.akk .same{opacity:1}
.mcards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:1000px){.mcards{grid-template-columns:repeat(2,1fr)}}
.mc{background:var(--card);border:1px solid var(--line);border-radius:var(--dt-r-md);padding:.9em;display:flex;flex-direction:column;gap:.5em;cursor:pointer;text-align:left;transition:border-color .2s,transform .25s var(--dt-ease)}
.mc:hover,.mc.on{border-color:var(--red);transform:translateY(-3px)}
.mc svg{width:2.4em;height:2.4em;stroke:var(--red);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mc h3{font-size:1.35em}
.mc .fn{font-size:.82em;color:var(--dt-paper-2)}
.mc .exs{font-weight:600;font-size:.95em;border-top:1px solid var(--dt-hair);padding-top:.5em}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.45em 1.1em;font-weight:700;cursor:pointer;min-height:44px}
.tabs button[aria-selected=true]{background:var(--red);border-color:var(--red);color:var(--dt-ink-0)}
table.cj{border-collapse:separate;border-spacing:0 6px;width:100%;max-width:34em}
table.cj td{padding:.45em .9em;background:var(--card);font-size:1.3em;font-weight:600}
table.cj td:first-child{color:var(--dim);font:600 .8em var(--mono);border-radius:10px 0 0 10px;width:8em}
table.cj td:last-child{border-radius:0 10px 10px 0}
table.cj tr.hl td{background:color-mix(in srgb,var(--red) 16%,var(--card));color:var(--ink)}
table.cj tr.hl td:last-child{color:var(--red)}
.rule{border-left:4px solid var(--red);background:var(--card);padding:.8em 1.1em;border-radius:0 var(--dt-r-md) var(--dt-r-md) 0}
.rule b{color:var(--red)}
.exs-list{list-style:none;display:flex;flex-direction:column;gap:.35em}
.exs-list li{font-weight:600;font-size:1.1em}
.exs-list li::before{content:"→ ";color:var(--red)}
.vchips{display:flex;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.legend span{font:700 .68em var(--mono);padding:.2em .7em;border-radius:99px;border:1px solid var(--line)}
.srow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:.7em 0;border-bottom:1px solid var(--dt-hair)}
@media(max-width:860px){.srow{grid-template-columns:1fr}}
.rvwrap{display:flex;flex-direction:column;gap:12px}
.rvcard{background:var(--card);border:1px solid var(--line);border-radius:var(--dt-r-md);padding:.9em 1.1em;display:flex;flex-direction:column;gap:.5em}
.rvcard .es{font-size:1.25em;font-weight:600}
.rvcard textarea{background:var(--dt-ink-0);border:1px solid var(--line);border-radius:10px;padding:.4em .7em;resize:vertical;min-height:2.6em;width:100%}
.rvbox{display:none;border-left:4px solid var(--ok);padding:.2em .8em;font-weight:700;font-size:1.15em;color:var(--ok)}
.rvbox.hint{border-color:var(--gold);color:var(--gold)}
.rvbox.on{display:block;animation:rise .35s var(--dt-ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.xq{display:flex;flex-direction:column;gap:.5em}
.xq .topic{font:700 .62em var(--mono);color:var(--red);letter-spacing:.12em;text-transform:uppercase}
.xmark{font:700 .85em var(--mono)}
.xmark.ok{color:var(--ok)}.xmark.no{color:var(--red)}
.score{font-size:clamp(2.4rem,1.6rem+3vw,4.6rem);font-weight:700;line-height:1}
.score small{font-size:.35em;color:var(--dim);margin-left:.3em}
.rcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:860px){.rcards{grid-template-columns:1fr}}
.rcards .card h3{font-size:1.05em;margin-bottom:.4em}
.rcards .card h3 span{color:var(--red);font-family:var(--mono);margin-right:.4em}
.rcards p{font-size:.88em;color:var(--dt-paper-2)}
.rcards .ex{margin-top:.5em;font-weight:700;font-size:.95em;color:var(--ink)}
#kl{width:110px;height:110px;flex:none}
.gold{color:var(--gold)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="top"><span id="brand">Deutschtrainer <i>·</i> Drei Regeln, ein Satz</span><div id="blocks" role="navigation" aria-label="Blöcke"></div><span id="num">1 / 20</span></div>

<script>
'use strict';
const D=JSON.parse(document.getElementById('deck-data').textContent);
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold=s=>String(s).toLowerCase().normalize('NFC').replace(/[.!?¿¡,;:]/g,'').replace(/\s+/g,' ').trim().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const REDUCE=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
const KEY='dt:drei-regeln:v1';
let ST;try{ST=JSON.parse(sessionStorage.getItem(KEY)||'null')}catch(e){ST=null}
if(!ST||ST.v!==1)ST={v:1,res:{},exam:{ans:null,sub:false,rev:false}};
const save=()=>{try{sessionStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}};
const QZ=[];   // instancias de quiz (para «repetir lo fallado»)

/* ── Escenario de fichas con FLIP ── */
function Stage(host){
  return{set(tokens){
    const old=new Map($$(':scope>[data-k]',host).map(n=>[n.dataset.k,n]));
    const first=new Map([...old].map(([k,n])=>[k,n.getBoundingClientRect()]));
    const keep=new Set(tokens.map(t=>t.k));
    old.forEach((n,k)=>{if(!keep.has(k))n.remove()});
    const fresh=[];
    tokens.forEach((t,idx)=>{
      let n=old.get(t.k);
      if(!n){n=document.createElement(t.btn?'button':'span');if(t.btn)n.type='button';n.dataset.k=t.k;fresh.push(n)}
      n.className='tk '+(t.c||'');
      n.textContent=t.t;
      if(t.b)n.dataset.b=t.b;else delete n.dataset.b;
      if(t.click)n.onclick=t.click;
      host.appendChild(n);
    });
    if(REDUCE())return;
    tokens.forEach(t=>{
      const n=$(`:scope>[data-k="${t.k}"]`,host),f=first.get(t.k);
      if(f){const l=n.getBoundingClientRect(),dx=f.left-l.left,dy=f.top-l.top;
        if(dx||dy)n.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:520,easing:'cubic-bezier(.22,1,.36,1)'})}
      else n.animate([{opacity:0,transform:'translateY(16px) scale(.94)'},{opacity:1,transform:'none'}],{duration:420,easing:'cubic-bezier(.22,1,.36,1)'});
    });
  }};
}
/* Pasos de una animación: devuelve {step(), reset(), cur} */
function Steps(n,apply,after){let cur=0;apply(0);return{get cur(){return cur},max:n-1,
  step(){if(cur>=n-1)return false;cur++;apply(cur);after&&after(cur);return true},
  reset(){cur=0;apply(0)},to(i){cur=i;apply(i)}}}

/* ── Quiz genérico (un ejercicio cada vez, un resultado por ejercicio) ── */
function feedback(it,ok,hint){
  // Solución mostrada: la oración completa (huecos/ordenar/máquina), la corrección (detective) o la propia frase si ya era correcta.
  const sol=it.sol||(it.fix&&it.fix[0])||(it.ok?it.t:'')||(it.a&&it.a[0])||'';
  if(ok)return `<b>✓ Richtig.</b> <span>${esc(sol)}${it.ex?' · '+esc(it.ex):''}</span>`;
  return `<b>✗ Noch nicht.</b> <span>${hint?esc(hint)+' ':''}Lösung: <b>${esc(sol)}</b>${it.ex?' · '+esc(it.ex):''}</span>`;
}
function quiz(host,prefix,items,bodies,opt={}){
  let cur=0;host.classList.add('quiz');
  host.innerHTML='<div class="qhead"><div class="pips"></div><span class="qcount" aria-live="polite"></span></div><div class="qbody card"></div><div class="qfb" aria-live="polite"></div><div class="qnav"><button type="button" class="btn ghost" data-a="prev">← Zurück</button><button type="button" class="btn" data-a="next">Weiter →</button><button type="button" class="btn ghost" data-a="redo" hidden>Fehler wiederholen</button></div>';
  const q=s=>$(s,host),idOf=i=>prefix+'-'+i,R=i=>ST.res[idOf(i)];
  const score=()=>items.filter((_,i)=>R(i)&&R(i).ok).length,answered=()=>items.filter((_,i)=>R(i)).length;
  function paint(){
    q('.pips').innerHTML=items.map((_,i)=>`<button type="button" class="pip${R(i)?(R(i).ok?' ok':' no'):''}${i===cur?' cur':''}" data-i="${i}" aria-label="Aufgabe ${i+1}${R(i)?(R(i).ok?' richtig':' falsch'):''}"></button>`).join('');
    q('.qcount').textContent=`${answered()} / ${items.length}`+(answered()===items.length?` · ${score()} richtig`:'');
    q('[data-a=redo]').hidden=!(answered()===items.length&&score()<items.length);
    q('[data-a=prev]').disabled=cur===0;q('[data-a=next]').disabled=cur===items.length-1;
  }
  function show(i){
    cur=i;const it=items[i],prev=R(i),body=q('.qbody'),fb=q('.qfb');body.innerHTML='';fb.innerHTML='';fb.className='qfb';
    const api={prev,done(ok,v,o={}){
      if(!o.restored){ST.res[idOf(i)]={ok,v};save()}
      fb.className='qfb '+(ok?'good':'bad');fb.innerHTML=feedback(it,ok,o.hint)+(o.extra?`<br><span>${o.extra}</span>`:'');paint();
      if(answered()===items.length&&opt.onFinish)opt.onFinish(score(),items.length);
    }};
    bodies[it.type||opt.type](it,body,api);paint();
  }
  host.addEventListener('click',e=>{
    const p=e.target.closest('.pip');if(p){show(+p.dataset.i);return}
    const a=e.target.closest('[data-a]');if(!a)return;
    if(a.dataset.a==='prev'&&cur>0)show(cur-1);
    if(a.dataset.a==='next'&&cur<items.length-1)show(cur+1);
    if(a.dataset.a==='redo'){items.forEach((_,i)=>{if(R(i)&&!R(i).ok)delete ST.res[idOf(i)]});save();show(items.findIndex((_,i)=>!R(i)))}
  });
  const inst={prefix,items,show,host,
    failed:()=>items.map((_,i)=>i).filter(i=>R(i)&&!R(i).ok),
    reset(i){delete ST.res[idOf(i)]},refresh(){const f=items.findIndex((_,i)=>!R(i));show(f<0?0:f)}};
  QZ.push(inst);
  const f=items.findIndex((_,i)=>!R(i));show(f<0?0:f);
  return inst;
}
const lockInput=(inp,ck)=>{inp.disabled=true;if(ck)ck.hidden=true};
const BODIES={
  gap(it,el,api){
    const [a,b]=it.t.split('___');
    el.innerHTML=`<p class="qt">${esc(a)}<input class="gap" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Lücke ausfüllen" size="${Math.max(6,it.a[0].length+2)}">${esc(b||'')}</p><div class="row"><button type="button" class="btn" data-ck>Prüfen</button></div>`;
    const inp=$('input',el),ck=$('[data-ck]',el);
    if(api.prev){inp.value=api.prev.v;lockInput(inp,ck);inp.classList.add(api.prev.ok?'ok':'no');api.done(api.prev.ok,api.prev.v,{restored:true});return}
    const go=()=>{const v=inp.value.trim();if(!v){inp.focus();return}const ok=it.a.some(x=>fold(x)===fold(v));lockInput(inp,ck);inp.classList.add(ok?'ok':'no');api.done(ok,v)};
    ck.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};
  },
  mc(it,el,api){
    const [a,b]=it.t.split('___');
    el.innerHTML=`<p class="qt">${esc(a)}<span class="blank">&nbsp;</span>${esc(b||'')}</p><div class="opts">${it.o.map(o=>`<button type="button" class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    const blank=$('.blank',el),opts=$$('.opt',el);
    const mark=(v,ok,restored)=>{opts.forEach(x=>{x.disabled=true;if(x.dataset.o===it.a[0])x.classList.add('ok')});
      const c=opts.find(x=>x.dataset.o===v);if(!ok&&c)c.classList.add('no');blank.textContent=v;blank.classList.add(ok?'ok':'no');api.done(ok,v,{restored})};
    if(api.prev){mark(api.prev.v,api.prev.ok,true);return}
    opts.forEach(o=>o.onclick=()=>mark(o.dataset.o,o.dataset.o===it.a[0],false));
  },
  order(it,el,api){
    el.innerHTML=`<p class="dim">${esc(it.p||'')}</p><div class="line" aria-label="Dein Satz"></div><div class="pool" aria-label="Wörter"></div><div class="row"><button type="button" class="btn" data-ck disabled>Prüfen</button><button type="button" class="btn ghost" data-rs>Neu</button></div>`;
    const line=$('.line',el),pool=$('.pool',el),ck=$('[data-ck]',el),rs=$('[data-rs]',el);let placed=[],locked=false,okState=null;
    const valid=ix=>ix.length===it.tok.length&&it.tok[ix[1]].r==='fin'&&it.tok[ix[ix.length-1]].r==='end';
    const draw=()=>{
      line.innerHTML=placed.map(i=>`<button type="button" class="chip${locked?(okState?' ok':' no'):''}" data-p="${i}"${locked?' disabled':''}>${esc(it.tok[i].t)}</button>`).join('')||'<span class="dim">Toca las palabras en el orden correcto</span>';
      pool.innerHTML=it.tok.map((t,i)=>placed.includes(i)?'':`<button type="button" class="chip" data-i="${i}"${locked?' disabled':''}>${esc(t.t)}</button>`).join('');
      ck.disabled=locked||placed.length!==it.tok.length;rs.disabled=locked;
    };
    const finish=(restored)=>{locked=true;okState=valid(placed);ck.hidden=true;rs.hidden=true;draw();
      const sentence=cap(placed.map(i=>it.tok[i].t).join(' '))+'.';
      let hint='';if(!okState)hint=it.tok[placed[1]].r!=='fin'?'El verbo conjugado va en la posición 2.':`${it.endName||'El infinitivo'} va al final.`;
      api.done(okState,placed.slice(),{restored,hint,extra:'Dein Satz: '+esc(sentence)})};
    el.addEventListener('click',e=>{
      const c=e.target.closest('.chip');if(!c||locked)return;
      if(c.dataset.i!==undefined)placed.push(+c.dataset.i);else placed=placed.filter(i=>i!==+c.dataset.p);draw();
    });
    ck.onclick=()=>finish(false);rs.onclick=()=>{placed=[];draw()};
    if(api.prev){placed=api.prev.v.slice();finish(true);return}
    draw();
  },
  machine(it,el,api){
    const forms=[...new Set(D.modals[it.mod].f)],ends=['','e','en','em'].map(e=>it.pos+e);
    const opt=(arr)=>'<option value="">—</option>'+arr.map(x=>`<option>${esc(x)}</option>`).join('');
    el.innerHTML=`<p class="dim">Baue den Satz: conjuga el modal y elige la terminación del posesivo.</p><div class="machine"><div class="slotw"><small>1 · Subjekt</small><span class="box">${cap(esc(it.subj))}</span></div><div class="slotw"><small>2 · ${esc(it.mod)} konjugiert</small><select data-m aria-label="Modalverb konjugiert">${opt(forms)}</select></div><div class="slotw"><small>Possessiv (${esc(it.pos)}…)</small><select data-p aria-label="Possessivartikel">${opt(ends)}</select></div><div class="slotw"><small>Nomen</small><span class="box">${esc(it.n)}</span></div><div class="slotw"><small>Ende · Infinitiv</small><span class="box inf">${esc(it.inf)}</span></div></div><div class="row"><button type="button" class="btn" data-ck disabled>Prüfen</button></div>`;
    const sm=$('[data-m]',el),sp=$('[data-p]',el),ck=$('[data-ck]',el);
    const upd=()=>{ck.disabled=!(sm.value&&sp.value)};sm.onchange=sp.onchange=upd;
    const finish=(v,restored)=>{const mo=v.m===it.a,po=v.p===it.ansPos;sm.value=v.m;sp.value=v.p;sm.disabled=sp.disabled=true;ck.hidden=true;
      sm.classList.add(mo?'ok':'no');sp.classList.add(po?'ok':'no');
      const hint=mo&&po?'':(!mo&&!po?'Revisa la conjugación y la terminación.':!mo?'La forma del modal no concuerda con el sujeto.':'La terminación del posesivo no es la del Akkusativ.');
      api.done(mo&&po,v,{restored,hint})};
    if(api.prev){finish(api.prev.v,true);return}
    ck.onclick=()=>finish({m:sm.value,p:sp.value},false);
  },
  detect(it,el,api){
    el.innerHTML=`<p class="qt sent">${esc(it.t)}</p><div class="row"><button type="button" class="btn ghost" data-v="ok">Richtig</button><button type="button" class="btn ghost" data-v="bad">Falsch</button></div><div class="row" data-fix hidden><input class="gap wide" type="text" autocomplete="off" spellcheck="false" aria-label="Korrektur"><button type="button" class="btn" data-ck>Prüfen</button></div>`;
    const fix=$('[data-fix]',el),inp=$('input',el),sent=$('.qt',el);
    const end=(v,fixed,restored)=>{
      $$('[data-v]',el).forEach(b=>b.disabled=true);fix.hidden=true;
      const ok=v==='ok'?it.ok===true:(it.ok===false&&it.fix.some(x=>fold(x)===fold(fixed||'')));
      sent.innerHTML=it.m.replace(/\[(.+?)\]/g,'<mark>$1</mark>').replace(/^(?!.*<mark>)(.*)$/,'$1');
      api.done(ok,{v,fixed},{restored,hint:v==='bad'&&it.ok===false&&!ok?'Marcaste bien que había error, pero la corrección no es exacta.':(v==='ok'&&!it.ok?'Esta frase sí tiene un error.':(v==='bad'&&it.ok?'Esta frase es correcta.':''))})};
    if(api.prev){inp.value=api.prev.v.fixed||'';end(api.prev.v.v,api.prev.v.fixed,true);return}
    $('[data-v=ok]',el).onclick=()=>end('ok');
    $('[data-v=bad]',el).onclick=()=>{if(it.ok){end('bad')}else{fix.hidden=false;inp.focus()}};
    const go=()=>{if(inp.value.trim())end('bad',inp.value.trim())};$('[data-ck]',el).onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};
  }
};

const examScore=(q,vals)=>q.any?(q.any.some(x=>fold(x)===fold(vals[0]||''))?1:0):(q.a.every((al,i)=>al.some(x=>fold(x)===fold(vals[i]||'')))?1:0);
const examTotal=()=>ST.exam.ans?D.exam.reduce((n,q,i)=>n+examScore(q,ST.exam.ans[i]||[]),0):0;
function examReveal(){
  if(!ST.exam.sub)examSubmit();
  ST.exam.rev=true;save();paintExam();paintSummary();
}
function examSubmit(){
  const host=$('#xq');if(!host)return;
  ST.exam.ans=D.exam.map((_,i)=>$$(`[data-q="${i}"] input`,host).map(x=>x.value.trim()));ST.exam.sub=true;save();paintExam();paintSummary();
}
function paintExam(){
  const host=$('#xq');if(!host)return;
  D.exam.forEach((q,i)=>{
    const box=$(`[data-q="${i}"]`,host);if(!box)return;
    const ins=$$('input',box);
    if(ST.exam.ans)ins.forEach((x,k)=>{x.value=ST.exam.ans[i][k]||''});
    ins.forEach(x=>x.disabled=ST.exam.sub);
    const m=$('.xmark',box);
    if(ST.exam.rev){const ok=examScore(q,ST.exam.ans[i]||[]);m.className='xmark '+(ok?'ok':'no');m.innerHTML=ok?'✓ 1 / 1':`✗ 0 / 1 · Lösung: ${esc(q.sol)}`}
    else if(ST.exam.sub){m.className='xmark';m.textContent='Abgegeben'}
    else m.textContent='';
  });
  $('#xsub').hidden=ST.exam.sub;
  $('#xst').innerHTML=ST.exam.rev?`<b class="gold">Prüfung ausgewertet: ${examTotal()} / ${D.exam.length}</b>`:ST.exam.sub?'<b>Gespeichert.</b> Las soluciones las muestra el profesor al terminar (tecla <span class="mono">L</span>).':'Un punto por pregunta. Sin soluciones hasta que el profesor cierre la prueba.';
}

   :ST.exam.sub?'<p class="dim">Prüfung abgegeben. El profesor la corrige con la tecla <span class="mono">L</span>.</p>':'<p class="dim">Aún no has hecho la Mini-Prüfung (diapositiva 19).</p>';
  host.innerHTML=mini;
  const all=QZ.flatMap(z=>z.items.map((_,i)=>({z,i,r:ST.res[z.prefix+'-'+i]}))),done=all.filter(x=>x.r),bad=all.filter(x=>x.r&&!x.r.ok);
  $('#ssum').textContent=`Ejercicios: ${done.filter(x=>x.r.ok).length} / ${done.length} correctos${bad.length?` · ${bad.length} para repetir`:''}`;
  $('#rep').hidden=!bad.length;$('#rep').textContent=`Repetir los ${bad.length} ejercicios fallados`;
  $('#again').hidden=!ST.exam.sub;
  const k=window.__klaus;if(k&&k.c){try{k.c.setState(ST.exam.rev?(examTotal()>=3?'celebrating':'motivating'):'idle')}catch(e){}}
  $('#kmsg').textContent=ST.exam.rev?(examTotal()>=3?'¡Stark! Ya sabes explicar muss, meinen y anrufen.':'Repasa lo fallado y vuelve a intentarlo: tú puedes.'):'Cuando termine la prueba, Klaus te dirá cómo vas.';
}
slide('pruefung','Was haben wir <em>gelernt</em>?',`
 <div class="rcards"><div class="card"><h3><span>1</span>Possessivartikel</h3><p>Se adaptan al <b>género, número y caso</b>. Masculino singular en Akkusativ: <b>-en</b>.</p><p class="ex">Ich sehe meinen Bruder.</p></div>
 <div class="card"><h3><span>2</span>Modalverben</h3><p>El modal conjugado ocupa la <b>posición 2</b> y el <b>infinitivo</b> va al final.</p><p class="ex">Ich muss heute lernen.</p></div>
 <div class="card"><h3><span>3</span>Trennbare Verben</h3><p>Se separan si están conjugados en una oración principal; <b>unidos en infinitivo</b> tras un modal.</p><p class="ex">Ich muss meinen Bruder anrufen.</p></div></div>
 <div class="cols"><div class="card"><p class="eyebrow">Mini-Prüfung</p><div id="sum"></div><p class="caption" id="ssum" style="margin-top:.5em"></p>
 <div class="row"><button type="button" class="btn" id="rep" hidden></button><button type="button" class="btn ghost" id="again" hidden>Prüfung wiederholen</button></div></div>
 <div class="card row" style="flex-wrap:nowrap"><canvas id="kl" width="220" height="220" aria-hidden="true"></canvas><div><p class="eyebrow">Klaus</p><p id="kmsg" class="lead"></p><p style="margin-top:.5em"><a class="btn ghost" href="${PRACTICE}">Practicar estos temas</a></p></div></div></div>`,
 el=>{
  $('#rep',el).onclick=()=>{
    const z=QZ.find(x=>x.failed().length);if(!z)return;
    QZ.forEach(x=>{x.failed().forEach(i=>x.reset(i))});save();
    QZ.forEach(x=>x.refresh());
    go(SL.findIndex(s=>s.el.contains(z.host)));paintSummary();
  };
  $('#again',el).onclick=()=>{ST.exam={ans:null,sub:false,rev:false};save();$$('#xq input').forEach(x=>{x.value='';x.disabled=false});paintExam();paintSummary();go(18)};
 });

/* ── Montaje, navegación y teclado ── */
const deck=$('#deck');let cur=0;
SL.forEach((s,i)=>{
  const el=document.createElement('section');el.className='slide';el.id='s'+(i+1);
  const b=D.blocks.find(x=>x.id===s.block);
  el.innerHTML=`<div class="sl"><div class="eyebrow">${String(i+1).padStart(2,'0')} · ${esc(b.name)}</div><h2>${s.title}</h2>${s.html}</div>`;
  deck.appendChild(el);s.el=el;s.init&&s.init(el);
});
$('#blocks').innerHTML=D.blocks.map(b=>`<button type="button" data-b="${b.id}">${esc(b.name)}<small>${b.from}–${b.from+b.min} min</small></button>`).join('');
function klaus(){
  if(window.__klaus)return;window.__klaus={c:null};
  const s=document.createElement('script');s.src='/klaus/klaus-renderer.js';
  s.onload=()=>{try{const sk=localStorage.getItem('dt:klaus-skin');const cv=$('#kl');
    window.__klaus.c=window.KlausWeb.create(cv,{skin:sk&&window.KlausWeb.skinExists(sk)?sk:'default',state:'idle'});paintSummary()}catch(e){$('#kl').style.display='none'}};
  s.onerror=()=>{$('#kl').style.display='none'};document.head.appendChild(s);
}
function go(n){
  if(n<0||n>=SL.length)return;
  SL[cur].el.classList.remove('on');cur=n;const s=SL[cur];s.el.classList.add('on');s.el.scrollTop=0;
  $('#num').textContent=`${cur+1} / ${SL.length}`;$('#bar').style.width=((cur+1)/SL.length*100)+'%';
  $$('#blocks button').forEach(b=>b.classList.toggle('on',b.dataset.b===s.block));
  const b=D.blocks.find(x=>x.id===s.block);
  $('#notes').innerHTML=`<b>Min ${b.from}–${b.from+b.min} · ${esc(b.name)}</b> &nbsp;·&nbsp; ${esc(D.notes[cur]||'')}`;
  try{history.replaceState(null,'','#'+(cur+1))}catch(e){}
  if(s.el.id==='s20'){klaus();paintSummary()}
  if(s.el.id==='s19')paintExam();
}
function space(){
  const s=SL[cur];if(s.el.step&&s.el.step())return;
  const rv=$('.rvbox:not(.on):not(.hint)',s.el);if(rv){rv.classList.add('on');return}
  go(cur+1);
}
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target,typing=/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
  if(typing){if(e.key==='Escape')t.blur();return}
  const k=e.key,onCtl=t.closest&&t.closest('button,a');
  if(k==='ArrowRight'||k==='PageDown'){e.preventDefault();go(cur+1)}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(cur-1)}
  else if(k===' '||k==='Enter'){if(onCtl)return;e.preventDefault();space()}
  else if(k==='Home'){go(0)}else if(k==='End'){go(SL.length-1)}
  else if(k==='t'||k==='T')document.body.classList.toggle('times');
  else if(k==='n'||k==='N')$('#notes').classList.toggle('on');
  else if(k==='h'||k==='H')$$('.rvbox.on',SL[cur].el).forEach(x=>x.classList.remove('on'));
  else if(k==='l'||k==='L'){if(cur>=18)examReveal()}
  else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&e.detail>0&&!b.closest('#nav'))b.blur()});
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#blocks').onclick=e=>{const b=e.target.closest('button');if(b)go(SL.findIndex(s=>s.block===b.dataset.b))};
const h0=parseInt((location.hash||'').slice(1),10);go(h0>=1&&h0<=SL.length?h0-1:0);
window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1),10);if(n>=1&&n<=SL.length&&n-1!==cur)go(n-1)});
</script>
</body>
