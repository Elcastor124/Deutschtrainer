# Despliegue en Render (https://render.com) con un clic: «New → Blueprint» y elegir este repositorio.
services:
  - type: web
    name: deutsch-blackcard
    runtime: node
    plan: starter            # con disco persistente; en «free» funciona, pero los datos se borran al dormir
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1          # el estado vive en memoria y en el disco: UNA sola instancia (ver docs/SECURITY_AUDIT.md)
    envVars:
      - key: TRUST_PROXY       # Render añade 1 salto a X-Forwarded-For: así los límites usan la IP real del cliente
        value: "1"
      - key: TEACHER_AUTH      # optional | required | off. Pasar a «required» solo tras validar la migración
        value: optional
      - key: TEACHER_PASSWORD  # contraseña de Teacher OS: se pone en el panel de Render, nunca aquí
        sync: false
      - key: SUPABASE_URL      # copia de los datos en Supabase (sin disco persistente). Valores en el panel de Render
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NODE_VERSION
        value: 22.19.0
      - key: DATA_DIR
        value: /var/data
    disk:
      name: blackcard-data
      mountPath: /var/data
      sizeGB: 1
